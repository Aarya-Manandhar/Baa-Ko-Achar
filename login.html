<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Baa Ko Achar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fef7ed 0%, #fff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(242, 118, 10, 0.10);
      padding: 48px 32px 36px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .auth-title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f2760a, #bc4508);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .auth-subtitle {
      color: #6b7280;
      font-size: 1.05rem;
      margin-bottom: 28px;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .auth-form input {
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      background: #fafafa;
      transition: border 0.2s;
    }
    .auth-form input:focus {
      border-color: #f2760a;
      background: #fff;
      outline: none;
    }
    .auth-btn {
      padding: 14px 0;
      background: linear-gradient(135deg, #f2760a, #e35d05);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.2s;
    }
    .auth-btn:hover {
      background: linear-gradient(135deg, #e35d05, #bc4508);
      transform: translateY(-2px);
    }
    .auth-link {
      margin-top: 22px;
      color: #666;
      font-size: 0.98rem;
    }
    .auth-link a {
      color: #f2760a;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .auth-link a:hover {
      color: #bc4508;
      text-decoration: underline;
    }
    .auth-message {
      margin-bottom: 10px;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 500;
      display: none;
    }
    .auth-message.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }
    .auth-message.success {
      background: #efe;
      color: #363;
      border: 1px solid #cfc;
      display: block;
    }
    @media (max-width: 500px) {
      .auth-container {
        padding: 28px 8px 18px 8px;
      }
      .auth-title {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-tabs" style="display:flex;justify-content:center;margin-bottom:18px;gap:8px;background:#f7f7f7;border-radius:10px 10px 0 0;box-shadow:0 2px 8px rgba(242,118,10,0.04);padding-top:4px;">
      <button class="auth-tab active" style="background:#f2760a;color:#fff;border:none;padding:10px 28px;border-radius:10px 10px 0 0;font-weight:600;cursor:default;">User Login</button>
      <button class="auth-tab" onclick="window.location.href='admin-login.html'" style="background:#fff;color:#f2760a;border:none;padding:10px 28px;border-radius:10px 10px 0 0;font-weight:600;cursor:pointer;">Admin Login</button>
    </div>
    <div class="auth-title">Login</div>
    <div class="auth-subtitle">Sign in to your Baa Ko Achar account</div>
    <div id="authMessage" class="auth-message"></div>
    <form id="loginForm" class="auth-form" autocomplete="on">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit" class="auth-btn">Login</button>
    </form>
    <div class="auth-link">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const msg = document.getElementById('authMessage');
      msg.style.display = 'none';
      msg.className = 'auth-message';
      try {
        const res = await fetch('login.php', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          msg.textContent = data.message;
          msg.className = 'auth-message success';
          msg.style.display = 'block';
          setTimeout(() => { window.location.href = 'index.html'; }, 900);
        } else {
          msg.textContent = data.message;
          msg.className = 'auth-message error';
          msg.style.display = 'block';
        }
      } catch (err) {
        msg.textContent = 'Server error. Please try again.';
        msg.className = 'auth-message error';
        msg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
